[pytest]
# Pytest configuration for JobSeeker AI

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio configuration
asyncio_mode = auto

# Coverage settings
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=70

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires database/redis)
    chaos: Chaos tests for free-tier limits
    smoke: Smoke tests for production
    slow: Slow tests (>5 seconds)
    
# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Environment variables for tests
env =
    ENVIRONMENT=test
    DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jobseeker_test
    REDIS_URL=redis://localhost:6379
    SECRET_KEY=test-secret-key-for-testing-only
    CACHE_TTL_HOURS=0
    DEBUG=true